name: Release

# lean-embed is a pure library, so it does NOT use jhheider/rust-ci's release.yml
# (that reusable is binary-first: bin-name + targets are required, and it builds
# per-target archives + a Homebrew tap that a library has no use for). This is a
# minimal crate-publish: cut a GitHub release and it publishes to crates.io.
# Runs on the self-hosted runner while the repo is private. If rust-ci later
# grows a lib-only publish workflow, switch to it.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
